[project]
name = "youtube-chat-spikes"
version = "0.1.0"
description = "Find the biggest chat spikes in finished YouTube streams."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.5.0",
    "pillow>=13.0.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
chat-spikes = "chat_spikes.cli:main"
chat-spikes-web = "chat_spikes.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_spikes"]
